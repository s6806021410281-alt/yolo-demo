<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทายรูป: car / cat / dog / bike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<style>
  :root {
    --bg: #f3f5f8; --panel: #ffffff; --ink: #18202e; --muted: #5d6879; --line: #d9dee7; --accent: #1f5eff; --onaccent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161d; --panel: #1b212b; --ink: #e8ecf3; --muted: #9aa5b6; --line: #2e3745; --accent: #6b95ff; --onaccent: #0c1220; }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); background: var(--bg); font-family: "IBM Plex Sans Thai", system-ui, sans-serif; line-height: 1.6;
         padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; font-weight: 600; }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 12px; }
  .pick { background: var(--accent); color: var(--onaccent); border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .pick:focus-visible, input[type=range]:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .pick[disabled] { opacity: .5; cursor: not-allowed; }
  label.conf { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  #status { color: var(--muted); min-height: 1.6em; margin-bottom: 8px; }
  #status.err { color: #d6336c; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; justify-content: center; }
  canvas { max-width: 100%; height: auto; display: block; border-radius: 4px; }
  .empty { color: var(--muted); padding: 48px 12px; text-align: center; }
  ul#list { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  ul#list li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<main>
  <h1>ทายรูป: car / cat / dog / bike</h1>
  <p class="sub">โมเดล YOLO segmentation รันในเบราว์เซอร์ของคุณ รูปไม่ถูกส่งไปที่ไหน</p>
  <div class="bar">
    <button class="pick" id="pick" disabled>เลือกรูป</button>
    <input type="file" id="file" accept="image/*" hidden>
    <label class="conf">ความมั่นใจขั้นต่ำ
      <input type="range" id="conf" min="0.05" max="0.95" step="0.05" value="0.25">
      <span id="confv">25%</span>
    </label>
  </div>
  <div id="status">กำลังโหลดโมเดล…</div>
  <div class="stage"><canvas id="out" hidden></canvas><div class="empty" id="empty">เลือกรูปเพื่อดูผลทำนาย</div></div>
  <ul id="list"></ul>
</main>

<script>
const MODEL_URL = 'best.onnx';
const NAMES = ['car', 'cat', 'dog', 'bike'];
const COLORS = ['#e8590c', '#12b886', '#f08c00', '#7048e8'];
const S = 640, M = 160, IOU = 0.7, MAX_SIDE = 1280;

const $ = id => document.getElementById(id);
const statusEl = $('status'), out = $('out'), ctx = out.getContext('2d');
let session = null, img = null;

function say(msg, err) { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; }

async function loadModel() {
  try {
    session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ['wasm'] });
    say('พร้อมใช้งาน เลือกรูปได้เลย');
    $('pick').disabled = false;
  } catch (e) {
    say('โหลดโมเดลไม่ได้: ตรวจว่าไฟล์ best.onnx อยู่โฟลเดอร์เดียวกับ index.html และเปิดผ่านเว็บเซิร์ฟเวอร์ (ไม่ใช่ file://) — ' + e.message, true);
  }
}

function letterbox(image, W, H) {
  const scale = Math.min(S / W, S / H);
  const nw = Math.round(W * scale), nh = Math.round(H * scale);
  const padX = Math.floor((S - nw) / 2), padY = Math.floor((S - nh) / 2);
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = 'rgb(114,114,114)'; g.fillRect(0, 0, S, S);
  g.drawImage(image, padX, padY, nw, nh);
  const px = g.getImageData(0, 0, S, S).data, n = S * S, f = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    f[i] = px[i * 4] / 255; f[n + i] = px[i * 4 + 1] / 255; f[2 * n + i] = px[i * 4 + 2] / 255;
  }
  return { tensor: new ort.Tensor('float32', f, [1, 3, S, S]), scale, nw, nh, padX, padY };
}

function iou(a, b) {
  const x1 = Math.max(a.x1, b.x1), y1 = Math.max(a.y1, b.y1), x2 = Math.min(a.x2, b.x2), y2 = Math.min(a.y2, b.y2);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return inter / ((a.x2 - a.x1) * (a.y2 - a.y1) + (b.x2 - b.x1) * (b.y2 - b.y1) - inter + 1e-9);
}

function decode(det, conf) {
  const d = det.data, N = det.dims[2], nc = NAMES.length, nm = det.dims[1] - 4 - nc, cand = [];
  for (let i = 0; i < N; i++) {
    let best = 0, bs = 0;
    for (let c = 0; c < nc; c++) { const s = d[(4 + c) * N + i]; if (s > bs) { bs = s; best = c; } }
    if (bs < conf) continue;
    const cx = d[i], cy = d[N + i], w = d[2 * N + i], h = d[3 * N + i];
    const coef = new Float32Array(nm);
    for (let k = 0; k < nm; k++) coef[k] = d[(4 + nc + k) * N + i];
    cand.push({ cls: best, score: bs, x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2, coef });
  }
  cand.sort((a, b) => b.score - a.score);
  const keep = [];
  for (const c of cand) if (!keep.some(k => k.cls === c.cls && iou(k, c) > IOU)) keep.push(c);
  return keep;
}

function maskCanvas(det, proto, color) {
  const P = proto.data, nm = proto.dims[1], r = M / S, mc = document.createElement('canvas');
  mc.width = mc.height = M;
  const g = mc.getContext('2d'), id = g.createImageData(M, M);
  const x1 = Math.max(0, Math.floor(det.x1 * r)), x2 = Math.min(M - 1, Math.ceil(det.x2 * r));
  const y1 = Math.max(0, Math.floor(det.y1 * r)), y2 = Math.min(M - 1, Math.ceil(det.y2 * r));
  const rgb = [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16)];
  for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) {
    let v = 0;
    for (let k = 0; k < nm; k++) v += det.coef[k] * P[k * M * M + y * M + x];
    if (v > 0) { const o = (y * M + x) * 4; id.data[o] = rgb[0]; id.data[o + 1] = rgb[1]; id.data[o + 2] = rgb[2]; id.data[o + 3] = 120; }
  }
  g.putImageData(id, 0, 0);
  return mc;
}

async function run() {
  if (!session || !img) return;
  const conf = parseFloat($('conf').value);
  const k = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const W = Math.round(img.naturalWidth * k), H = Math.round(img.naturalHeight * k);
  out.width = W; out.height = H;
  ctx.drawImage(img, 0, 0, W, H);
  say('กำลังทำนาย…');
  await new Promise(r => setTimeout(r, 20));
  try {
    const lb = letterbox(img, W, H);
    const res = await session.run({ [session.inputNames[0]]: lb.tensor });
    const det = res[session.outputNames[0]], proto = res[session.outputNames[1]];
    const items = decode(det, conf);
    const lw = Math.max(2, W / 400), fs = Math.max(14, Math.round(W / 40));
    ctx.lineWidth = lw; ctx.font = `600 ${fs}px "IBM Plex Sans Thai", sans-serif`; ctx.textBaseline = 'top';
    for (const it of items) {
      const col = COLORS[it.cls];
      const mc = maskCanvas(it, proto, col);
      ctx.drawImage(mc, lb.padX * M / S, lb.padY * M / S, lb.nw * M / S, lb.nh * M / S, 0, 0, W, H);
      const bx = (it.x1 - lb.padX) / lb.scale, by = (it.y1 - lb.padY) / lb.scale;
      const bw = (it.x2 - it.x1) / lb.scale, bh = (it.y2 - it.y1) / lb.scale;
      ctx.strokeStyle = col; ctx.strokeRect(bx, by, bw, bh);
      const label = `${NAMES[it.cls]} ${(it.score * 100).toFixed(1)}%`;
      const tw = ctx.measureText(label).width + 8, ty = Math.max(0, by - fs - 4);
      ctx.fillStyle = col; ctx.fillRect(bx, ty, tw, fs + 4);
      ctx.fillStyle = '#fff'; ctx.fillText(label, bx + 4, ty + 2);
    }
    $('list').innerHTML = items.map(it =>
      `<li><span class="dot" style="background:${COLORS[it.cls]}"></span>${NAMES[it.cls]} ${(it.score * 100).toFixed(1)}%</li>`).join('');
    say(items.length ? `พบ ${items.length} วัตถุ` : 'ไม่พบวัตถุ ลองลดค่าความมั่นใจขั้นต่ำ');
  } catch (e) { say('ทำนายไม่สำเร็จ: ' + e.message, true); }
}

$('pick').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => { img = im; out.hidden = false; $('empty').hidden = true; run(); };
  im.onerror = () => say('เปิดรูปนี้ไม่ได้', true);
  im.src = URL.createObjectURL(f);
};
$('conf').oninput = e => { $('confv').textContent = Math.round(e.target.value * 100) + '%'; };
$('conf').onchange = run;
loadModel();
</script>
</body>
</html>
